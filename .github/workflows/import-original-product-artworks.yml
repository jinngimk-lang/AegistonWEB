name: Import original product artworks

on:
  push:
    branches:
      - media/original-product-artworks-use-this
    paths:
      - .github/workflows/import-original-product-artworks.yml

permissions:
  contents: write

jobs:
  import-originals:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: media/original-product-artworks-use-this
          fetch-depth: 0

      - name: Download exact uploaded PNG originals
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p frontend/public/media/product-originals

          curl --fail --location --retry 3 \
            'https://d2ol7oe51mr4n9.cloudfront.net/user_3IRacwrw6b8di26SJ8N3xLu82dx/dbe99d4e-8526-45da-b7d4-f8b664905ce1.png' \
            -o frontend/public/media/product-originals/aragonteam-original.png

          curl --fail --location --retry 3 \
            'https://d2ol7oe51mr4n9.cloudfront.net/user_3IRacwrw6b8di26SJ8N3xLu82dx/48918795-c958-4e3b-a904-d5f7e6ddf444.png' \
            -o frontend/public/media/product-originals/inkclaw-original.png

          curl --fail --location --retry 3 \
            'https://d2ol7oe51mr4n9.cloudfront.net/user_3IRacwrw6b8di26SJ8N3xLu82dx/f5b071e3-d23d-4857-97c6-b20b9422e356.png' \
            -o frontend/public/media/product-originals/private-deployment-original.png

          curl --fail --location --retry 3 \
            'https://d2ol7oe51mr4n9.cloudfront.net/user_3IRacwrw6b8di26SJ8N3xLu82dx/bf5bffcf-9bf7-42ce-8e03-811765081d42.png' \
            -o frontend/public/media/product-originals/legallens-original.png

          cat > /tmp/originals.sha256 <<'EOF'
          e21d41fa299cab80f4d293f3716d58fe3b99813d8e451eff15cceea66e2573c4  frontend/public/media/product-originals/aragonteam-original.png
          cc5cc9b9c0641d142410ad76b6fce208f232bba450d88a39b4c54880ee15a0e8  frontend/public/media/product-originals/inkclaw-original.png
          bb91d7fffaae83aa033477bc7f6f510a5907194cbf50b6b347792707e470fd8e  frontend/public/media/product-originals/private-deployment-original.png
          112b6913dc2f6792721f9f2ea1a247da22483f48077596576bc8ece6828d4187  frontend/public/media/product-originals/legallens-original.png
          EOF
          sha256sum --check /tmp/originals.sha256

          python - <<'PY'
          import struct
          from pathlib import Path

          expected = (1448, 1086)
          root = Path('frontend/public/media/product-originals')
          for path in sorted(root.glob('*.png')):
              data = path.read_bytes()
              if data[:8] != b'\x89PNG\r\n\x1a\n':
                  raise SystemExit(f'{path}: invalid PNG signature')
              width, height = struct.unpack('>II', data[16:24])
              if (width, height) != expected:
                  raise SystemExit(f'{path}: unexpected dimensions {(width, height)}')
              print(f'{path}: {width}x{height} PNG OK')
          PY

      - name: Commit originals to archive branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add frontend/public/media/product-originals
          git rm .github/workflows/import-original-product-artworks.yml
          git commit -m 'media: store exact original product artworks'
          git push origin HEAD:media/original-product-artworks-use-this
