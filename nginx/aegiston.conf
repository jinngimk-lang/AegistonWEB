# 智瞳安宇 Aegiston 官网 · nginx 反向代理
#
# ⚠️ 安全响应头必须与 frontend/next.config.mjs 的 headers() **逐字一致**
# （spec §11.3）。tests/e2e/security-headers.spec.ts 对全部路由断言。
#
# CSP 的 v1 选择是 'unsafe-inline' 而不是 nonce：
# CSP Level 2+ 规定一旦出现 nonce 就忽略同一指令里的 'unsafe-inline'，二者没有
# 「先宽松再逐步收紧」的中间态；而 Next.js 的 nonce 必须由 middleware 逐请求
# 下发，读取 nonce 的页面会被强制转为动态渲染，直接推翻 ISR + Full Route Cache。
#
# ⚠️ v3 修订（spec §4.2.7）：v2 这段论证的第一条前提是「站内不存在任何用户
# 输入的回显路径」。`/search?q=…` 上线后那条前提就不成立了，而留着一句已经
# 不成立的安全论证比没有论证更危险。现在的论证是：
#   本站唯一的用户输入回显点是 /search 的查询串，且它**只经文本节点渲染**
#   （frontend/src/components/search/Highlight.tsx，eslint 的 react/no-danger
#   在 search 目录下强制打开），不进任何 JSON-LD 与内联脚本 —— JSON.stringify
#   不转义 `<` 与 `/`，一个 `</script>` 就能闭合标签，那才是真正的注入点；
#   洞察正文经 bleach 白名单净化；无第三方脚本。
# 因此 'unsafe-inline' 的取舍前提依然成立。

# --- 公网直连 API 的限流（v3 spec §4.2.6 / R11） ---
# 保护对象是**公网直连 /api/ 这一面**：SSR 取数走 docker 内网
# （docker-compose.yml 把 API_BASE_URL 设成 http://api:8000，根本不经过 nginx），
# 线索提交走 Server Action，浏览器也不直连 /api/。
# 10r/s + burst=20 远高于官网真实 QPS，只作用于 /api/，页面路径不受影响。
limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

upstream aegiston_web {
    server web:3000;
    keepalive 32;
}

upstream aegiston_api {
    server api:8000;
    keepalive 16;
}

# 全部图片与字体已本地化，CSP 可以做到 default-src 'self'，无任何外部域白名单
map $sent_http_content_type $aegiston_csp {
    default "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; img-src 'self' data: blob:; media-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; font-src 'self'; connect-src 'self'; manifest-src 'self'; upgrade-insecure-requests";
}

server {
    listen 80;
    server_name _;

    # 生产环境应打开 HTTPS 重定向；本文件默认保留 80 端口直服，
    # 便于内网私有化部署（很多政企现场不走公网证书）。
    # return 301 https://$host$request_uri;

    include /etc/nginx/conf.d/aegiston-common.inc;
}

server {
    listen 443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/aegiston.crt;
    ssl_certificate_key /etc/nginx/certs/aegiston.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    include /etc/nginx/conf.d/aegiston-common.inc;
}
