[project]
name = "aegiston-api"
version = "1.0.0"
description = "智瞳安宇 Aegiston 官网内容与线索 API（FastAPI）"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "gunicorn>=22.0; sys_platform != 'win32'",
  "pydantic>=2.9",
  "pydantic-settings>=2.4",
  "email-validator>=2.2",
  "sqlmodel>=0.0.22",
  "aiosqlite>=0.20",
  "alembic>=1.13",
  "slowapi>=0.1.9",
  "structlog>=24.4",
  "python-ulid>=2.7",
  "markdown-it-py>=3.0",
  "bleach>=6.1",
  # 纯 Python，无编译。只用它的 registry 与文本格式化；middleware 是手写的
  # （app/core/metrics.py 抬头写了为什么不用 instrumentator）。
  "prometheus-client>=0.20",
]

[project.optional-dependencies]
# 资源管线（构建期一次性使用，运行期镜像不需要）
assets = ["pillow>=10.1"]
dev = [
  "pytest>=7.4",
  "pytest-cov>=5.0",
  "pytest-asyncio>=0.23",
  "httpx>=0.27",
  "ruff>=0.6",
  "mypy>=1.11",
  "types-bleach>=6.1",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 110  # 中文注释与文案偏长，100 会把说明性注释切碎
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "C4", "SIM", "RUF"]
# B008   FastAPI 的 Depends()/Query() 默认值就是这么写的
# RUF012 Pydantic 字段的 list/dict 默认值由框架深拷贝，不是共享可变默认值
# RUF001-003 全角标点在中文注释与文案里是正确写法
ignore = ["B008", "RUF012", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
# asset_map.py 是一张**数据表**（77 条 asset 的 alt / caption 文案）。
# 中文 alt 必须描述界面内容而不是「截图」（spec §10.2），断行会让它更难核对。
"scripts/asset_map.py" = ["E501"]
# 这两个文件的 docstring 里嵌的是**单行**跨平台命令（spec §7.4 / P1-15 明确
# 要求不使用 `\` 续行），断行反而会让人复制出错误命令。
"scripts/extract_pptx_assets.py" = ["E501"]
"scripts/validate_assets.py" = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.mypy]
python_version = "3.11"
plugins = []
strict_optional = true
warn_unused_ignores = true
disallow_untyped_defs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.coverage.run]
source = ["app"]
omit = ["app/content/*"]

[tool.coverage.report]
fail_under = 85
show_missing = true
