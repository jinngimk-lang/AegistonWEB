[alembic]
script_location = alembic
prepend_sys_path = .
version_path_separator = os
; sqlalchemy.url is intentionally empty: env.py reads the *synchronous* URL from
; AEGISTON_SYNC_DATABASE_URL. Handing Alembic the async URL (sqlite+aiosqlite://)
; raises at startup -- see spec P1-13. Keep this file ASCII-only: configparser
; reads it with the platform locale encoding, which is GBK on Windows.

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
